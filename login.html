<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login — STRIDE Marketplace</title>
  <meta name="description" content="Sign in to your STRIDE collector account to view saved grails, track shipments, and manage seller consignments.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
  <link rel="stylesheet" href="../css/stride.css">
</head>
<body>

  <!-- Header -->
  <header class="stride-header">
    <div class="container">
      <div class="nav-inner">
        <a href="../index.html" class="brand-logo" aria-label="STRIDE Home">
          <img src="../assets/logo.svg" alt="STRIDE — Be Your Own" width="160" height="40">
        </a>

        <nav class="nav-links">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="sell.html" class="nav-link">Sell Your Sneakers</a>
          <a href="about.html" class="nav-link">About</a>
        </nav>

        <div class="nav-actions">
          <a href="signup.html" class="btn btn-outline btn-sm">Create Account</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="../assets/logo-mark.svg" alt="STRIDE Mark" width="46" height="46" style="margin: 0 auto 1.25rem;">
        <h1>ACCESS <span class="text-neon">THE VAULT</span></h1>
        <p style="font-size: 0.9rem; color: #A0A4AE;">Sign in to your verified collector account.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="collector@stride.com" required>
          <span class="form-error-msg">Please enter a valid email.</span>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between;">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" onclick="STRIDE_APP.showToast('Password reset link dispatched to email', 'info'); return false;" style="font-size: 0.76rem; color: #FF5A1F; font-family: var(--font-mono);">Forgot Password?</a>
          </div>
          <div class="auth-password-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" style="width: 100%; padding-right: 3rem;" required>
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error-msg">Password must be at least 6 characters.</span>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #A0A4AE; cursor: pointer;">
            <input type="checkbox" id="remember-me" checked style="accent-color: #FF5A1F;">
            Remember this session
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-bottom: 1.25rem;">
          SIGN IN TO ACCOUNT
        </button>

        <button type="button" id="demo-fill-btn" class="btn btn-secondary btn-sm btn-block" style="margin-bottom: 1.5rem;">
          ⚡ ONE-CLICK DEMO LOGIN (Alex Vance)
        </button>
      </form>

      <div style="text-align: center; border-top: 1px solid #292D38; padding-top: 1.5rem; font-size: 0.88rem; color: #A0A4AE;">
        New to STRIDE? <a href="signup.html" style="color: #FF5A1F; font-weight: 700;">Join the Collector Network →</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="stride-footer" style="padding: 2.5rem 0;">
    <div class="container text-center" style="font-size: 0.82rem; color: #626775;">
      &copy; 2026 STRIDE Marketplace Inc. All rights reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/stride-data.js"></script>
  <script src="../js/stride-core.js"></script>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('login-password');
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      toggleBtn.style.color = isPassword ? '#FF5A1F' : '#626775';
    });

    // Demo Fill Shortcut
    document.getElementById('demo-fill-btn').addEventListener('click', () => {
      document.getElementById('login-email').value = 'collector@stride.com';
      document.getElementById('login-password').value = 'stride2026';
      STRIDE_APP.showToast('Demo collector credentials populated!', 'info');
    });

    // Form Validation & Demonstration Login
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;
      const email = document.getElementById('login-email');
      const pwd = document.getElementById('login-password');

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email.value.trim())) {
        email.parentElement.classList.add('error');
        valid = false;
      } else {
        email.parentElement.classList.remove('error');
      }

      if (pwd.value.length < 6) {
        pwd.closest('.form-group').classList.add('error');
        valid = false;
      } else {
        pwd.closest('.form-group').classList.remove('error');
      }

      if (valid) {
        localStorage.setItem('stride_user', JSON.stringify({
          name: 'Alex Vance',
          email: email.value.trim(),
          role: 'Verified VIP Collector'
        }));
        STRIDE_APP.showToast('Welcome back, Alex Vance! Vault unlocked.', 'success');
        setTimeout(() => {
          window.location.href = 'orders.html';
        }, 1200);
      }
    });
  </script>
</body>
</html>
