<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="strideNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#FF5A1F" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Official Three-Triangle Symbol -->
  <g class="stride-symbol" transform="translate(4, 2)">
    <!-- Top Apex Triangle (Neon Accent with Glow) -->
    <polygon points="26,6 15,25 37,25" fill="url(#strideNeonGrad)" filter="url(#neonGlow)" />
    <!-- Bottom Left Triangle (Optic White) -->
    <polygon points="14,29 3,48 25,48" fill="#FFFFFF" />
    <!-- Bottom Right Triangle (Platinum) -->
    <polygon points="38,29 27,48 49,48" fill="#E2E8F0" />
  </g>

  <!-- Typography: STRIDE & Official Tagline -->
  <g class="stride-wordmark">
    <text x="66" y="34" font-family="'Outfit', 'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="3.5" fill="#FFFFFF">STRIDE</text>
    <text x="68" y="48" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="4.2" fill="#A0A4AE">BE YOUR OWN</text>
  </g>
</svg>
