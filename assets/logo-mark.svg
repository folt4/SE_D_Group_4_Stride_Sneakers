<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54" fill="none">
  <defs>
    <linearGradient id="strideNeonMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#FF5A1F" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(1, 0)">
    <!-- Top Apex Triangle -->
    <polygon points="26,6 15,25 37,25" fill="url(#strideNeonMarkGrad)" filter="url(#markGlow)" />
    <!-- Bottom Left Triangle -->
    <polygon points="14,29 3,48 25,48" fill="#FFFFFF" />
    <!-- Bottom Right Triangle -->
    <polygon points="38,29 27,48 49,48" fill="#E2E8F0" />
  </g>
</svg>
